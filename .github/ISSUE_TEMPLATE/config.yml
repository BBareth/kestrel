blank_issues_enabled: true
contact_links:
  - name: Security problem
    url: https://github.com/BBareth/kestrel/blob/main/SECURITY.md
    about: Never paste API keys, .env contents or account data into an issue. Read SECURITY.md first.
  - name: Everything says NO TRADE
    url: https://github.com/BBareth/kestrel/blob/main/docs/STRATEGY.md
    about: That is the normal state. The strategy is selective and the dashboard shows which check failed.
  - name: Trading halted
    url: https://github.com/BBareth/kestrel/blob/main/docs/TROUBLESHOOTING.md
    about: A fail-safe fired. System → events says which; clear the halt on the Trading page after fixing the cause.
